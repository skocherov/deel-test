version: 2

models:
  - name: stg_globepay__acceptance
    description: Globepay card acceptance report (one row per payment attempt). With amounts converted to USD.
    columns:
      - name: external_ref
        description: Transaction ID, used to join to chargebacks.
        data_tests:
          - unique
          - not_null
      - name: status
        description: ''
      - name: source
        description: Source system of the record.
      - name: ref
        description: ''
      - name: transacted_at
        description: Transaction time in UTC.
        data_tests:
          - not_null
      - name: transaction_date
        description: Transaction date in UTC.
        data_tests:
          - not_null
      - name: state
        description: Payment outcome, accepted or declined.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["accepted", "declined"]
      - name: is_accepted
        description: Whether the payment was accepted.
        data_tests:
          - not_null
      - name: is_cvv_provided
        description: Whether the CVV was provided.
      - name: amount
        description: Amount in local currency. Negative source amounts are converted to positive (ABS), as they are assumed to be sign errors.
        data_tests:
          - not_null
      - name: country
        description: Two-letter country code (UK changed to GB).
      - name: currency
        description: Three-letter currency code. AE records arrive as USD but are AED, so they are relabeled to AED.
      - name: fx_rate_to_usd
        description: Local currency units per 1 USD at transaction time. AED has no rate in the source, so the fixed peg of 3.6725 AED per 1 USD is used.
        data_tests:
          - not_null
      - name: amount_usd
        description: Amount in USD (amount / fx_rate_to_usd).
        data_tests:
          - not_null
